services:
  - type: web
    name: sst-pro
    runtime: node
    plan: free
    buildCommand: npm ci --only=production
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
    disk:
      name: sst-data
      mountPath: /app/data
      sizeGB: 1
    healthCheckPath: /api/health
